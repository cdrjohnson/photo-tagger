[package]
name = "photo-tagger"
version = "1.0.18"
description = "Photo Tagger desktop app"
authors = ["cdrjohnson"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "photo_tagger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
